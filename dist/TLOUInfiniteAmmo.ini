; TLOU Infinite Ammo - settings
; Changes take effect the next time the game starts. Hotkeys work in-game.

[InfiniteAmmo]
; 1 = ammo never runs out. Magazines still empty and you reload normally
;     with the original animations; every reload fills the magazine even if
;     you had no ammo at all. Works without finishing the game.
InfiniteAmmo=1

; 1 = the HUD shows the infinity sign instead of the reserve count while
;     Infinite Ammo is on (like the official Gameplay Modifier).
ShowInfinitySign=1

; 1 = No Reload: your magazine never goes down, so you never reload.
;     Only affects the player; enemies still reload. Off by default.
NoReload=0

; Hotkeys (Windows virtual-key codes, 0 = disabled). Only work while the
; game window has focus. 118 = F7, 119 = F8.
ToggleInfiniteAmmoKey=118
ToggleNoReloadKey=119

; Short Windows sound when a hotkey toggles something.
BeepOnToggle=1

; Writes TLOUInfiniteAmmo.log next to the game exe.
Logging=1
