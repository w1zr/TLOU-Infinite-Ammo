name=TLOU Infinite Ammo
version=v1.0.0
description=Infinite ammo with normal reloads, for every gun, without finishing the game. Magazines still empty and you reload as usual; every reload is a full magazine and the HUD shows the infinity sign. F7 toggles infinite ammo, F8 toggles an optional No Reload mode (player only). Throwables and crafting are not affected. Loads as version.dll next to tlou-i.exe; settings in TLOUInfiniteAmmo.ini.
author=w1zr
